# レンダラのレジストリ。新方式は 1 エントリ足すだけ（コア無改修）。
# requires: 実行時に必要な外部コマンド（shutil.which で確認、無ければそのレンダラをスキップ）。

[[renderer]]
name = "html"
module = "datapattern.render.html_renderer:HtmlRenderer"
requires = []
deterministic = true

[[renderer]]
name = "graphviz"
module = "datapattern.render.graphviz_renderer:GraphvizRenderer"
requires = ["dot"]
deterministic = true

[[renderer]]
name = "wireviz"
module = "datapattern.render.wireviz_renderer:WirevizRenderer"
requires = ["wireviz"]
deterministic = true
