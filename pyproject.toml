[project]
name = "datapattern"
version = "0.1.0"
description = "Capital Logic アドオンのテスト用データパターンを洗い出し、図つき HTML レポートを生成する基盤"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "jinja2>=3.1",
]

[project.scripts]
datapattern = "datapattern.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapattern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ の Markdown 内コードサンプルは手書きの体裁を保つため整形対象外にする。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 日本語の全角括弧などを「紛らわしい Unicode」と警告する規則は、
# 本プロジェクトは説明文を日本語で書くため無効化する。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# SVG / mxGraph XML を組み立てるモジュールは長い f-string リテラルが多い。
"src/datapattern/render/svg_renderer.py" = ["E501"]
"src/datapattern/render/drawio_renderer.py" = ["E501"]
"src/datapattern/render/_schematic.py" = ["E501"]
